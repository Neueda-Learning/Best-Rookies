spring:
  datasource:
    # 首次本地启动时自动创建默认库，避免 Unknown database 错误
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfolio_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}"
    username: "${SPRING_DATASOURCE_USERNAME:root}"
    password: "${SPRING_DATASOURCE_PASSWORD:n3u3da!}"
  jpa:
    hibernate:
      # 验证 DDL（需要数据库已存在）
      ddl-auto: validate
    open-in-view: false
  flyway:
    # 启用 Flyway 数据库迁移
    enabled: true
    # 关闭严格校验以跳过校验码不匹配错误
    validateOnMigrate: false

app:
  market-price:
    enabled: "${MARKET_PRICE_ENABLED:true}"
    endpoint: "${MARKET_PRICE_ENDPOINT:https://c4rm9elh30.execute-api.us-east-1.amazonaws.com/default/cachedPriceData?ticker={ticker}}"
  market-symbol:
    enabled: "${MARKET_SYMBOL_ENABLED:true}"
    search-endpoint: "${MARKET_SYMBOL_ENDPOINT:https://query1.finance.yahoo.com/v1/finance/search?q={q}}"
  exchange-rate:
    # 是否启用 Yahoo Finance 实时汇率（false 时使用内置默认汇率）
    enabled: "${EXCHANGE_RATE_ENABLED:true}"
    # 汇率刷新间隔（毫秒），默认每小时刷新一次
    refresh-interval-ms: "${EXCHANGE_RATE_REFRESH_MS:3600000}"

server:
  # 可通过 SERVER_PORT 覆盖，避免本地端口冲突
  port: "${SERVER_PORT:8080}"
